name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -v

  api-smoke-test:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: clouud
          POSTGRES_PASSWORD: clouud
          POSTGRES_DB: clouud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clouud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clouud:clouud@localhost:5432/clouud
      ADMIN_KEY: ci-admin-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Apply engine provenance migration
        run: |
          python backend/migrations/003_engine_provenance_bridge.py

      - name: Verify engine registry seed
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          import os

          async def main():
              conn = await asyncpg.connect(os.environ["DATABASE_URL"])

              rows = await conn.fetch("""
                  SELECT engine_id
                  FROM engine_registry
                  ORDER BY layer
              """)

              actual = [row["engine_id"] for row in rows]

              expected = [
                  "wave-field-3d",
                  "propagation",
                  "pythagorean-graph",
                  "boundary-state",
                  "phyllotaxis-seed",
              ]

              assert actual == expected, {
                  "expected": expected,
                  "actual": actual,
              }

              print("engine registry seed: PASS")
              print("engines:", ", ".join(actual))

              await conn.close()

          asyncio.run(main())
          PY

      - name: Boot the API against real Postgres
        run: |
          set -euo pipefail

          python -m uvicorn backend.server:app \
            --host 0.0.0.0 \
            --port 8000 \
            > /tmp/clouud-api.log 2>&1 &

          API_PID=$!
          echo "API_PID=$API_PID"

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              break
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API process exited unexpectedly"
              cat /tmp/clouud-api.log
              exit 1
            fi

            sleep 1
          done

          curl -sf http://localhost:8000/api/v1/health
          echo
          echo "API startup: PASS"

      - name: Exercise real API flow (admin key -> issue key -> ingest -> proof -> verify -> compress -> download)
        run: |
          set -euo pipefail

          echo "=== ISSUE API KEY ==="

          KEY_RESPONSE=$(curl -sS \
            -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "X-Admin-Key: ci-admin-key" \
            http://localhost:8000/api/v1/api-keys)

          echo "$KEY_RESPONSE"

          KEY_STATUS=$(printf '%s\n' "$KEY_RESPONSE" |
            sed -n 's/^HTTP_STATUS=//p')

          if [ "$KEY_STATUS" != "200" ]; then
            echo "Issue API key failed with HTTP $KEY_STATUS"
            exit 1
          fi

          API_KEY=$(printf '%s\n' "$KEY_RESPONSE" |
            sed '/^HTTP_STATUS=/d' |
            python3 -c '
          import sys
          import json
          print(json.load(sys.stdin)["api_key"])
          ')

          echo "API_KEY: SET"

          echo
          echo "=== INGEST ==="

          EVENT_RESPONSE=$(curl -sS \
            -w '\nHTTP_STATUS=%{http_code}\n' \
            -X POST \
            http://localhost:8000/api/v1/events \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"event_type":"ci_smoke","payload":{"hello":"world"}}')

          echo "$EVENT_RESPONSE"

          EVENT_STATUS=$(printf '%s\n' "$EVENT_RESPONSE" |
            sed -n 's/^HTTP_STATUS=//p')

          if [ "$EVENT_STATUS" != "200" ]; then
            echo "Ingest failed with HTTP $EVENT_STATUS"
            exit 1
          fi

          EVENT_ID=$(printf '%s\n' "$EVENT_RESPONSE" |
            sed '/^HTTP_STATUS=/d' |
            python3 -c '
          import sys
          import json
          print(json.load(sys.stdin)["event_id"])
          ')

          echo "EVENT_ID=$EVENT_ID"

          echo
          echo "=== PROOF ==="

          PROOF_RESPONSE=$(curl -sS \
            -w '\nHTTP_STATUS=%{http_code}\n' \
            -X POST \
            http://localhost:8000/api/v1/proof \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"event_id\":\"$EVENT_ID\"}")

          echo "$PROOF_RESPONSE"

          PROOF_STATUS=$(printf '%s\n' "$PROOF_RESPONSE" |
            sed -n 's/^HTTP_STATUS=//p')

          if [ "$PROOF_STATUS" != "200" ]; then
            echo "Proof failed with HTTP $PROOF_STATUS"
            exit 1
          fi

          PROOF=$(printf '%s\n' "$PROOF_RESPONSE" |
            sed '/^HTTP_STATUS=/d')

          printf '%s\n' "$PROOF" |
            python3 -c '
          import sys
          import json

          d = json.load(sys.stdin)
          assert d["merkle_root"], d

          print("proof: PASS")
          print("merkle_root:", d["merkle_root"])
          '

          echo
          echo "=== VERIFY ==="

          VERIFY_REQUEST=$(printf '%s\n' "$PROOF" |
            python3 -c '
          import sys
          import json

          d = json.load(sys.stdin)

          print(json.dumps({
              "event_id": "'"$EVENT_ID"'",
              "proof": d["proof"]
          }))
          ')

          VERIFY_RESPONSE=$(curl -sS \
            -w '\nHTTP_STATUS=%{http_code}\n' \
            -X POST \
            http://localhost:8000/api/v1/verify \
            -H "Content-Type: application/json" \
            -d "$VERIFY_REQUEST")

          echo "$VERIFY_RESPONSE"

          VERIFY_STATUS=$(printf '%s\n' "$VERIFY_RESPONSE" |
            sed -n 's/^HTTP_STATUS=//p')

          if [ "$VERIFY_STATUS" != "200" ]; then
            echo "Verify failed with HTTP $VERIFY_STATUS"
            exit 1
          fi

          printf '%s\n' "$VERIFY_RESPONSE" |
            sed '/^HTTP_STATUS=/d' |
            python3 -c '
          import sys
          import json

          d = json.load(sys.stdin)
          assert d["valid"] is True, d

          print("verify: PASS")
          '

          echo
          echo "=== COMPRESS ==="

          echo '{"sample":"data","n":12345}' > /tmp/sample.json

          COMPRESS_RESPONSE=$(curl -sS \
            -w '\nHTTP_STATUS=%{http_code}\n' \
            -X POST \
            http://localhost:8000/api/v1/compress \
            -H "X-API-Key: $API_KEY" \
            -F "file=@/tmp/sample.json")

          echo "$COMPRESS_RESPONSE"

          COMPRESS_STATUS=$(printf '%s\n' "$COMPRESS_RESPONSE" |
            sed -n 's/^HTTP_STATUS=//p')

          if [ "$COMPRESS_STATUS" != "200" ]; then
            echo "Compression failed with HTTP $COMPRESS_STATUS"
            exit 1
          fi

          ARTIFACT_ID=$(printf '%s\n' "$COMPRESS_RESPONSE" |
            sed '/^HTTP_STATUS=/d' |
            python3 -c '
          import sys
          import json
          print(json.load(sys.stdin)["artifact_id"])
          ')

          echo "compress: PASS"
          echo "ARTIFACT_ID=$ARTIFACT_ID"

          echo
          echo "=== DOWNLOAD ==="

          DOWNLOAD_STATUS=$(curl -sS \
            -o /tmp/downloaded.bin \
            -w '%{http_code}' \
            -H "X-API-Key: $API_KEY" \
            "http://localhost:8000/api/v1/artifacts/$ARTIFACT_ID")

          echo "HTTP_STATUS=$DOWNLOAD_STATUS"

          if [ "$DOWNLOAD_STATUS" != "200" ]; then
            echo "Download failed with HTTP $DOWNLOAD_STATUS"
            exit 1
          fi

          test -s /tmp/downloaded.bin

          echo "download: PASS"
          echo "bytes: $(wc -c < /tmp/downloaded.bin)"

          echo
          echo "=== PHASE III-B API SMOKE: PASS ==="

      - name: Exercise engine provenance chain
        run: |
          set -euo pipefail

          echo "=== PYTHAGOREAN GRAPH ENGINE ==="

          ENGINE_RESPONSE=$(curl -sS \
            -w '\nHTTP_STATUS=%{http_code}\n' \
            -X POST \
            http://localhost:8000/api/v1/engines/pythagorean-graph \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "p_vector": {
                "depth": 5,
                "angle_left": 45,
                "angle_right": 45,
                "ratio": 0.707
              },
              "output_format": "json"
            }')

          echo "$ENGINE_RESPONSE"

          ENGINE_STATUS=$(printf '%s\n' "$ENGINE_RESPONSE" |
            sed -n 's/^HTTP_STATUS=//p')

          if [ "$ENGINE_STATUS" != "200" ]; then
            echo "Engine execution failed with HTTP $ENGINE_STATUS"
            exit 1
          fi

          ENGINE_JSON=$(printf '%s\n' "$ENGINE_RESPONSE" |
            sed '/^HTTP_STATUS=/d')

          printf '%s\n' "$ENGINE_JSON" |
            python3 -c '
          import sys
          import json

          d = json.load(sys.stdin)

          assert d["engine_id"] == "pythagorean-graph", d
          assert d["proof"]["merkle_root"], d

          print("engine REST: PASS")
          print("merkle_root:", d["proof"]["merkle_root"])
          '

          echo
          echo "=== ENGINE RUN PERSISTENCE ==="

          python3 - <<'PY'
          import asyncio
          import asyncpg
          import os

          async def main():
              conn = await asyncpg.connect(os.environ["DATABASE_URL"])

              row = await conn.fetchrow("""
                  SELECT
                      run_id,
                      engine_id,
                      status,
                      merkle_root
                  FROM engine_runs
                  WHERE engine_id = 'pythagorean-graph'
                  ORDER BY created_at DESC
                  LIMIT 1
              """)

              assert row is not None, "engine_runs row missing"
              assert row["engine_id"] == "pythagorean-graph"
              assert row["status"] == "computed"
              assert row["merkle_root"]

              chain = await conn.fetchrow("""
                  SELECT
                      artifact_id,
                      engine_id,
                      merkle_root
                  FROM provenance_chain
                  WHERE engine_id = 'pythagorean-graph'
                  ORDER BY utc_timestamp DESC
                  LIMIT 1
              """)

              assert chain is not None, "provenance_chain row missing"
              assert chain["engine_id"] == "pythagorean-graph"
              assert chain["merkle_root"] == row["merkle_root"]

              registry = await conn.fetchrow("""
                  SELECT
                      call_count
                  FROM engine_registry
                  WHERE engine_id = 'pythagorean-graph'
              """)

              assert registry is not None, "engine registry row missing"
              assert registry["call_count"] >= 1

              print("engine_runs: PASS")
              print("provenance_chain: PASS")
              print("merkle linkage: PASS")
              print("registry accounting: PASS")

              await conn.close()

          asyncio.run(main())
          PY

          echo
          echo "=== PHASE III-C ENGINE PROVENANCE GATE: PASS ==="

      - name: Dump API logs on failure
        if: failure()
        run: |
          echo "=== API LOG ==="
          cat /tmp/clouud-api.log || true
